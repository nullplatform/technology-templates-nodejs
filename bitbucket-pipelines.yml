# nullplatform CI for Bitbucket Pipelines.
#
# np build start -> make build/push (lambda and docker-image) -> np build update.
# Deployments are triggered by nullplatform, not by this pipeline.
#
# NULLPLATFORM_API_KEY is created by nullplatform as a secured repository
# variable when the application is created.

image: node:18

definitions:
  services:
    docker:
      memory: 2048
  steps:
    - step: &nullplatform-build
        name: Build
        services:
          - docker
        caches:
          - node
        script:
          - curl -fsSLo /usr/local/bin/np https://cli.nullplatform.com/2.13.0/np-Linux-amd
          - chmod +x /usr/local/bin/np
          - apt-get update && apt-get install -y --no-install-recommends zip
          - np build start
          - make build ASSET_TYPE=lambda
          - make push ASSET_TYPE=lambda
          - make build ASSET_TYPE=docker-image
          - make push ASSET_TYPE=docker-image
          - np build update --status=successful
        after-script:
          - if [ "$BITBUCKET_EXIT_CODE" -ne 0 ]; then np build update --status=failed; fi

pipelines:
  branches:
    main:
      - step: *nullplatform-build
